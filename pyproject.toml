[project]
name = "takein-sms"
version = "0.1.0"
description = "TakeIn SMS — Google Voice Takeout → Android SMS"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "TakeIn SMS contributors" }]
dependencies = [
  "customtkinter==6.0.0",
  "windnd==1.0.7",
  "darkdetect==0.8.0",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.8.0",
  "pytest>=8.0.0",
  "pyinstaller>=6.0.0",
]

[project.scripts]
takein-sms = "gui_app:main"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
  "dist",
  "build",
  "vendor",
  "output",
  "backups",
  ".cursor",
  "scripts",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
